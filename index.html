<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛩️</text></svg>">
    <title>台灣進香朝聖地圖 | Taiwan Pilgrim Map</title>

    <!-- Open Graph / Twitter 分享預覽(O7) -->
    <meta property="og:title" content="台灣進香朝聖地圖 | Taiwan Pilgrim Map" />
    <meta property="og:description" content="標記神靈在台灣的落地點，連結廟宇之間的源流，並記錄你自己的進香之路。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://galen-chu.github.io/TAIWAN-Pilgrimage/" />
    <meta property="og:image" content="https://galen-chu.github.io/TAIWAN-Pilgrimage/og-image.png" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="台灣進香朝聖地圖 | Taiwan Pilgrim Map" />
    <meta name="twitter:description" content="標記神靈在台灣的落地點，連結廟宇之間的源流，並記錄你自己的進香之路。" />
    <meta name="twitter:image" content="https://galen-chu.github.io/TAIWAN-Pilgrimage/og-image.png" />

    <!-- Leaflet CSS(vendor 自托管,版本見 vendor/README.md) -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />

    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="vendor/leaflet-routing-machine/leaflet-routing-machine.css" />

    <!-- Leaflet Marker Cluster CSS -->
    <link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="title" data-i18n="title">台灣進香朝聖地圖</h1>
        </div>
        <div class="search-container">
            <input type="text"
                   id="search-input"
                   class="search-input"
                   data-i18n-placeholder="searchPlaceholder"
                   placeholder="搜尋廟宇名稱或地址...">
            <div id="search-results" class="search-results"></div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                <span></span>
            </button>

            <!-- Filters Section -->
            <section class="filter-section">
                <h2 data-i18n="filterByDeity">依神明篩選</h2>
                <div id="deity-filters" class="filter-group">
                    <!-- Dynamically populated -->
                </div>

                <h2 data-i18n="filterByRegion">依地區篩選</h2>
                <div id="region-filters" class="filter-group">
                    <!-- Dynamically populated -->
                </div>

                <h2 data-i18n="filterByNetwork">源流網絡</h2>
                <div id="network-filters" class="filter-group">
                    <!-- Dynamically populated (O2) -->
                </div>
                <p class="network-filter-note" data-i18n="networkFilterNote">源流線：勾選網絡時以此為準；未勾選時跟隨神明篩選</p>

                <div class="filter-checkbox lodging-filter">
                    <input type="checkbox" id="lodging-only-filter">
                    <label for="lodging-only-filter">僅顯示有香客大樓（規劃進香住宿）</label>
                </div>

                <button id="clear-filters" class="btn-clear" data-i18n="clearFilters">清除篩選</button>
            </section>

            <!-- Journey Section (v1.x) -->
            <section class="journey-section">
                <h2 data-i18n="journeyTitle">進香足跡</h2>
                <div id="journey-stats" class="journey-stats"></div>
                <div class="journey-buttons">
                    <button id="journey-export-json" class="btn-secondary">匯出 JSON</button>
                    <button id="journey-export-gpx" class="btn-secondary">匯出 GPX</button>
                    <button id="journey-import" class="btn-secondary">匯入</button>
                    <button id="journey-clear" class="btn-clear">清除</button>
                    <input type="file" id="journey-import-file" accept=".json,.gpx" style="display:none;">
                </div>
                <div id="journey-records" class="journey-records"></div>
            </section>

            <!-- Route Planning Section -->
            <section class="route-section">
                <h2 data-i18n="planRoute">路線規劃</h2>

                <div class="route-form">
                    <label for="route-start" data-i18n="start">起點</label>
                    <select id="route-start" class="route-select">
                        <option value="" data-i18n="selectTemple">選擇廟宇...</option>
                    </select>

                    <label for="route-end" data-i18n="end">終點</label>
                    <select id="route-end" class="route-select">
                        <option value="" data-i18n="selectTemple">選擇廟宇...</option>
                    </select>

                    <button id="calculate-route" class="btn-primary" data-i18n="getRoute">規劃路線</button>
                    <button id="clear-route" class="btn-secondary" data-i18n="clearRoute">清除路線</button>
                </div>

                <div id="route-info" class="route-info" style="display: none;">
                    <div class="route-detail">
                        <span class="route-label" data-i18n="distance">距離:</span>
                        <span id="route-distance" class="route-value"></span>
                    </div>
                    <div class="route-detail">
                        <span class="route-label" data-i18n="estimatedTime">預估時間:</span>
                        <span id="route-time" class="route-value"></span>
                    </div>
                </div>
            </section>
        </aside>

        <!-- Map Container -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Temple Detail Modal -->
    <div id="temple-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-body">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>
            <span data-i18n="mapData">地圖資料:</span>
            <a href="https://www.openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a> |
            <span data-i18n="routing">路線規劃:</span>
            <a href="http://project-osrm.org/" target="_blank" rel="noopener">OSRM</a>
        </p>
    </footer>

    <!-- Scripts -->
    <!-- Data -->
    <script src="data/temples.js"></script>
    <script src="data/lineage.js"></script>

    <!-- Leaflet JS(vendor 自托管,版本見 vendor/README.md) -->
    <script src="vendor/leaflet/leaflet.js"></script>

    <!-- Leaflet Routing Machine -->
    <script src="vendor/leaflet-routing-machine/leaflet-routing-machine.min.js"></script>

    <!-- Leaflet Marker Cluster -->
    <script src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>

    <!-- App Modules -->
    <script src="js/i18n.js"></script>
    <script src="js/map.js"></script>
    <script src="js/base-layer.js"></script>
    <script src="js/lineage-layer.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/journey-ui.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/search.js"></script>
    <script src="js/routing.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
